name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install Poetry
        run: uv tool install poetry==2.4.1
      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi
      - name: Run pre-commit
        run: poetry run pre-commit run --all-files --show-diff-on-failure
      - name: Type-check
        run: poetry run mypy

  test:
    name: Tests (Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        django-version: ["5.2", "6.1"]
        exclude:
          - python-version: "3.11"
            django-version: "6.1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install Poetry
        run: uv tool install poetry==2.4.1
      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi
      - name: Install Django ${{ matrix.django-version }}
        run: poetry run pip install "django==${{ matrix.django-version }}.*"
      - name: Run tests
        run: poetry run pytest

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install Poetry
        run: uv tool install poetry==2.4.1
      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi
      - name: Build
        run: poetry build
      - name: Check metadata
        run: poetry run twine check dist/*
